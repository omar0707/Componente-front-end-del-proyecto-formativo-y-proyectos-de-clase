    // --- COMPONENTE CITAS DATATABLE ---
    function CitasDataTable({ citas, onOpenAgendar, onCompletarCita, onVerAlbum }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterEstado, setFilterEstado] = useState('TODAS');
      const [copiedToken, setCopiedToken] = useState(null);

      const filtered = citas.filter(c => {
        const matchesEstado = filterEstado === 'TODAS' || c.estado === filterEstado;
        const term = searchTerm.toLowerCase();
        const matchesSearch =
          c.nombreMascota.toLowerCase().includes(term) ||
          c.nombreCliente.toLowerCase().includes(term) ||
          c.nombreServicio.toLowerCase().includes(term) ||
          c.tokenAcceso.toLowerCase().includes(term);
        return matchesEstado && matchesSearch;
      });

      const copyToken = (tok) => {
        navigator.clipboard?.writeText(tok);
        setCopiedToken(tok);
        setTimeout(() => setCopiedToken(null), 2000);
      };

      return (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b border-slate-100 pb-3">

            </button>
          </div>

          <div className="flex flex-col sm:flex-row gap-3 justify-between items-stretch sm:items-center">
            <input
              type="text"
              placeholder="🔍 Buscar por mascota, dueño o token..."
              value={searchTerm}
              onChange={(e) => setSearchTerm(e.target.value)}
              className="px-3.5 py-2 border border-slate-300 rounded-xl text-xs flex-1 focus:outline-none focus:border-amber-500"
            />
            <div className="flex gap-1">
              {['TODAS', 'PENDIENTE', 'EN_PROCESO', 'COMPLETADA'].map(st => (
                <button
                  key={st}
                  onClick={() => setFilterEstado(st)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold ${filterEstado === st ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'
                    }`}
                >
                  {st === 'TODAS' ? 'Todas' : st}
                </button>
              ))}
            </div>
          </div>

          <div className="overflow-x-auto rounded-xl border border-slate-200">
            <table className="w-full text-left border-collapse text-xs">
              <thead className="bg-slate-100 text-slate-600 uppercase font-bold">

                  <th className="p-3">#</th>
                  <th className="p-3">Fecha</th>
                  <th className="p-3">Mascota</th>
                  <th className="p-3">Dueño</th>
                  <th className="p-3">Servicio</th>
                  <th className="p-3">Precio</th>
                  <th className="p-3">Estado</th>
                  <th className="p-3">Token Anti-IDOR</th>
                  <th className="p-3 text-right">Acciones</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {filtered.map(c => (
                  <tr key={c.idCita} className="hover:bg-slate-50">
                    <td className="p-3 font-bold">#{c.idCita}</td>
                    <td className="p-3 whitespace-nowrap">{c.fechaHora}</td>
                    <td className="p-3 font-bold">{c.nombreMascota} <span className="font-normal text-slate-400">({c.razaMascota})</span></td>
                    <td className="p-3">{c.nombreCliente}</td>
                    <td className="p-3">{c.nombreServicio}</td>
                    <td className="p-3 font-bold">${c.valorTotal.toLocaleString('es-CO')}</td>
                    <td className="p-3">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${c.estado === 'COMPLETADA' ? 'bg-emerald-100 text-emerald-800' :
                          c.estado === 'EN_PROCESO' ? 'bg-indigo-100 text-indigo-800' : 'bg-amber-100 text-amber-800'
                        }`}>
                        {c.estado}
                      </span>
                    </td>
                    <td className="p-3">
                      <div className="flex items-center gap-1">
                        <code className="bg-slate-100 px-1 py-0.5 rounded font-mono text-[10px]">{c.tokenAcceso.substring(0, 8)}...</code>
                        <button onClick={() => copyToken(c.tokenAcceso)} className="text-slate-400 hover:text-amber-600 text-xs">
                          {copiedToken === c.tokenAcceso ? '✔' : '📋'}
                        </button>
                      </div>
                    </td>
                    <td className="p-3 text-right">

                  </div>
                </div>
              </div>

              <div className="bg-white p-3 rounded-xl border border-slate-200 space-y-2">
                <label className="font-bold text-slate-700">Observaciones Finales:</label>
                <textarea
                  rows="2"
                  value={obs || c.observacionesEntrega || ''}
                  onChange={(e) => setObs(e.target.value)}
                  placeholder="Ej. Corte de uñas realizado, pelo desenredado..."
                  className="w-full border border-slate-300 rounded-lg p-1.5 text-xs"
                />
                <button
                  onClick={() => onFinalizarServicio(c.idCita, obs)}
                  disabled={c.estado === 'COMPLETADA'}
                  className={`w-full py-2 rounded-xl font-bold text-xs ${c.estado === 'COMPLETADA' ? 'bg-slate-200 text-slate-500' : 'bg-emerald-600 text-white'
                    }`}
                >
                  {c.estado === 'COMPLETADA' ? '✔ Turno Finalizado' : '✔ Finalizar y Notificar'}
                </button>
                {c.estado === 'COMPLETADA' && (
                  <button onClick={() => onVerAlbum(c.tokenAcceso)} className="w-full py-1.5 bg-slate-900 text-white rounded-lg text-xs font-bold">
                    🔗 Ver Álbum Generado
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- COMPONENTE ALBUM CLIENTE (FASE 5 - ANTI IDOR) ---
    function AlbumDigitalCliente({ citas, initialToken, onBackToDashboard }) {
      const [tokenInput, setTokenInput] = useState(initialToken || 'e4b2d18a-78f9-4c12-98ab-34cd56ef7890');
      const [tokenActivo, setTokenActivo] = useState(initialToken || 'e4b2d18a-78f9-4c12-98ab-34cd56ef7890');
      const c = citas.find(item => item.tokenAcceso === tokenActivo);

      return (
        <div className="max-w-2xl mx-auto space-y-4">
          <div className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-2">
            <span className="text-xs font-mono text-slate-400">canstyling.com/album?token=</span>
            <input
              type="text"
              value={tokenInput}
              onChange={(e) => setTokenInput(e.target.value)}
              className="flex-1 border border-slate-300 rounded-lg p-1.5 text-xs font-mono"
            />
            <button
              onClick={() => setTokenActivo(tokenInput.trim())}
              className="px-3 py-1.5 bg-amber-500 text-slate-950 rounded-lg text-xs font-bold"
            >
              Consultar
            </button>
          </div>

          {!c ? (
            <div className="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-2">
              <span className="text-4xl">🔒</span>
              <h3 className="text-base font-black text-rose-600">Acceso No Autorizado</h3>
              <p className="text-xs text-slate-500">Token no válido o expirado. Diseño de protección Anti-IDOR.</p>
              <button
                onClick={() => { setTokenActivo('e4b2d18a-78f9-4c12-98ab-34cd56ef7890'); setTokenInput('e4b2d18a-78f9-4c12-98ab-34cd56ef7890'); }}
                className="mt-2 px-3 py-1.5 bg-slate-900 text-white text-xs font-bold rounded-lg"
              >
                Cargar Token Válido de Prueba
              </button>
            </div>
          ) : (
            <div className="bg-white rounded-3xl overflow-hidden border border-slate-200 shadow-md">
              <div className="bg-gradient-to-r from-amber-500 to-amber-600 text-white p-6 text-center">
                <span className="text-3xl">🐶✨</span>
                <h1 className="text-xl font-black mt-1">¡Transformación de {c.nombreMascota}!</h1>
                <p className="text-xs text-amber-100">{c.nombreServicio} • Dueño: {c.nombreCliente}</p>
              </div>

              <div className="p-6 space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 text-center">
                    <span className="text-xs font-bold text-slate-600 block mb-2">✂️ 1. ANTES</span>
                    <img src={c.fotos?.antes || "https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=600&q=80"} className="w-full h-48 object-cover rounded-xl" />
                  </div>
                  <div className="bg-amber-50 p-3 rounded-2xl border border-amber-200 text-center">
                    <span className="text-xs font-bold text-amber-900 block mb-2">✨ 2. DESPUÉS</span>
                    <img src={c.fotos?.despues || "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=600&q=80"} className="w-full h-48 object-cover rounded-xl" />
                  </div>
                </div>

                {c.observacionesEntrega && (
                  <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-emerald-900 text-xs">
                    <strong>Nota del Estilista:</strong> {c.observacionesEntrega}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- COMPONENTE CLIENTES DATATABLE ---
    function ClientesDataTable({ clientes, onAddCliente }) {
      return (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
          <div className="border-b border-slate-100 pb-3">
            <h2 className="text-lg font-black text-slate-900">👥 Directorio de Propietarios</h2>
            <p className="text-xs text-slate-500">Soporte relacional multi-teléfono y fichas caninas</p>
          </div>

          <div className="overflow-x-auto rounded-xl border border-slate-200">
            <table className="w-full text-left border-collapse text-xs">
              <thead className="bg-slate-100 text-slate-600 uppercase font-bold">
                <tr>
                  <th className="p-3">ID</th>
                  <th className="p-3">Documento</th>
                  <th className="p-3">Propietario</th>
                  <th className="p-3">Correo</th>
                  <th className="p-3">Teléfonos / WhatsApp</th>
                  <th className="p-3">Mascotas</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {clientes.map(cl => (
                  <tr key={cl.idCliente} className="hover:bg-slate-50">
                    <td className="p-3 font-bold">#{cl.idCliente}</td>
                    <td className="p-3">{cl.tipoDocumento} {cl.numeroDocumento}</td>
                    <td className="p-3 font-bold">{cl.nombres} {cl.apellidos}</td>
                    <td className="p-3">{cl.correo}</td>
                    <td className="p-3">
                      {cl.telefonos.map(t => (
                        <div key={t.id} className="text-emerald-700 font-bold">📱 {t.numero} ({t.tipo})</div>
                      ))}
                    </td>
                    <td className="p-3">
                      {cl.mascotas?.map(m => (
                        <span key={m.idMascota} className="inline-block bg-amber-50 text-amber-900 px-2 py-0.5 rounded border border-amber-200 font-bold mr-1">
                          🐾 {m.nombre} ({m.raza})
                        </span>
                      ))}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- MODAL AGENDAR CITA ---
    function AgendarCitaModal({ isOpen, onClose, clientes, servicios, onCrearCita }) {
      if (!isOpen) return null;
      const [idCl, setIdCl] = useState(clientes[0]?.idCliente || 1);
      const [idSrv, setIdSrv] = useState(1);
      const [fecha, setFecha] = useState('2026-09-23 10:00');
      const [obs, setObs] = useState('');

      const cl = clientes.find(c => c.idCliente === Number(idCl)) || clientes[0];
      const m = cl.mascotas[0] || { idMascota: 1, nombre: 'Mascota', raza: 'Canina' };
      const s = servicios.find(srv => srv.idServicio === Number(idSrv)) || servicios[0];

      const handleSubmit = (e) => {
        e.preventDefault();
        const tok = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
        onCrearCita({
          idCita: Date.now() % 10000,
          idCliente: cl.idCliente,
          nombreCliente: `${cl.nombres} ${cl.apellidos}`,
          telefonoCliente: cl.telefonos[0]?.numero || '3001234567',
          idMascota: m.idMascota,
          nombreMascota: m.nombre,
          razaMascota: m.raza,
          idServicio: s.idServicio,
          nombreServicio: s.nombreServicio,
          fechaHora: fecha,
          estado: 'PENDIENTE',
          valorTotal: s.precioBase,
          tokenAcceso: tok,
          observacionesRecepcion: obs,
          observacionesEntrega: '',
          peluquero: 'Carlos Gómez',
          fotos: { antes: null, despues: null }
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
          <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="text-base font-black">📅 Agendar Cita</h3>
              <button onClick={onClose}>✕</button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="font-bold block">Cliente:</label>
                <select value={idCl} onChange={(e) => setIdCl(e.target.value)} className="w-full border rounded-lg p-2">
                  {clientes.map(c => <option key={c.idCliente} value={c.idCliente}>{c.nombres} {c.apellidos}</option>)}
                </select>
              </div>
              <div>
                <label className="font-bold block">Servicio:</label>
                <select value={idSrv} onChange={(e) => setIdSrv(e.target.value)} className="w-full border rounded-lg p-2">
                  {servicios.map(srv => <option key={srv.idServicio} value={srv.idServicio}>{srv.nombreServicio} - ${srv.precioBase}</option>)}
                </select>
              </div>
              <div>
                <label className="font-bold block">Fecha y Hora:</label>
                <input type="text" value={fecha} onChange={(e) => setFecha(e.target.value)} className="w-full border rounded-lg p-2" />
              </div>
              <div>
                <label className="font-bold block">Observaciones:</label>
                <input type="text" value={obs} onChange={(e) => setObs(e.target.value)} placeholder="Ej. Corte bajito" className="w-full border rounded-lg p-2" />
              </div>
              <div className="flex justify-end gap-2 pt-2">
                <button type="button" onClick={onClose} className="px-3 py-1.5 bg-slate-100 rounded-lg">Cancelar</button>
                <button type="submit" className="px-3 py-1.5 bg-amber-500 text-slate-950 font-bold rounded-lg">Confirmar</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MODAL LOGIN OTP ---
    function LoginModal({ isOpen, onClose, onLoginSuccess }) {
      if (!isOpen) return null;
      const [email, setEmail] = useState('');
      const [otp, setOtp] = useState('');
      const [sentOtp, setSentOtp] = useState(null);

      const handleSend = (e) => {
        e.preventDefault();
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setSentOtp(code);
      };

      const handleVerify = (e) => {
        e.preventDefault();
        if (otp === sentOtp) {
          onLoginSuccess({ nombre: email.split('@')[0], email, rol: 'CLIENTE_OTP' });
          onClose();
        } else {
          alert('Código OTP incorrecto.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop">
          <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="text-base font-black">🔐 Acceso OTP Passwordless</h3>
              <button onClick={onClose}>✕</button>
            </div>
            {!sentOtp ? (
              <form onSubmit={handleSend} className="space-y-3 text-xs">
                <div>
                  <label className="font-bold block">Correo Registrado:</label>
                  <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="laura@gmail.com" className="w-full border rounded-lg p-2" />
                </div>
                <button type="submit" className="w-full py-2 bg-amber-500 text-slate-950 font-bold rounded-lg">
                  Solicitar Código OTP
                </button>
              </form>
            ) : (
              <form onSubmit={handleVerify} className="space-y-3 text-xs">
                <div className="bg-amber-50 p-2.5 rounded-lg text-center">
                  <span className="block text-[10px] text-amber-800">Código OTP generado:</span>
                  <span className="text-xl font-black text-amber-900 tracking-widest">{sentOtp}</span>
                </div>
                <div>
                  <label className="font-bold block">Ingrese los 6 dígitos:</label>
                  <input type="text" maxLength={6} required value={otp} onChange={(e) => setOtp(e.target.value)} className="w-full border rounded-lg p-2 text-center text-base font-bold font-mono" />
                </div>
                <button type="submit" className="w-full py-2 bg-emerald-600 text-white font-bold rounded-lg">
                  Validar Código y Entrar
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // --- APP PRINCIPAL ---
    function App() {
      const [activeView, setActiveView] = useState('dashboard');
      const [citas, setCitas] = useState(INITIAL_CITAS);
      const [clientes, setClientes] = useState(INITIAL_CLIENTS);
      const [servicios] = useState(INITIAL_SERVICES);
      const [isAgendarOpen, setIsAgendarOpen] = useState(false);
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [selectedAlbumToken, setSelectedAlbumToken] = useState('e4b2d18a-78f9-4c12-98ab-34cd56ef7890');
      const [user, setUser] = useState({ nombre: 'Omar Molina (Admin)', rol: 'ADMINISTRADOR' });

      const handleCrearCita = (n) => setCitas([n, ...citas]);
      const handleCompletarCita = (id, obs) => {
        setCitas(citas.map(c => c.idCita === id ? { ...c, estado: 'COMPLETADA', observacionesEntrega: obs || 'Servicio completado con éxito.' } : c));
      };
      const handleUpdateCitaFoto = (id, tipo, dataUrl) => {
        setCitas(citas.map(c => c.idCita === id ? { ...c, fotos: { ...c.fotos, [tipo]: dataUrl } } : c));
      };
      const handleVerAlbum = (tok) => {
        setSelectedAlbumToken(tok);
        setActiveView('album');
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          <Navbar
            activeView={activeView}
            setActiveView={setActiveView}
            user={user}
            onOpenLogin={() => setIsLoginOpen(true)}
            onLogout={() => setUser(null)}
          />

          <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
            {activeView === 'dashboard' && <Dashboard citas={citas} clientes={clientes} setActiveView={setActiveView} onOpenAgendar={() => setIsAgendarOpen(true)} />}
            {activeView === 'citas' && <CitasDataTable citas={citas} onOpenAgendar={() => setIsAgendarOpen(true)} onCompletarCita={handleCompletarCita} onVerAlbum={handleVerAlbum} />}
            {activeView === 'clientes' && <ClientesDataTable clientes={clientes} onAddCliente={() => { }} />}
            {activeView === 'peluquero' && <PeluqueroMobileApp citas={citas} onUpdateCitaFoto={handleUpdateCitaFoto} onFinalizarServicio={handleCompletarCita} onVerAlbum={handleVerAlbum} />}
            {activeView === 'album' && <AlbumDigitalCliente citas={citas} initialToken={selectedAlbumToken} onBackToDashboard={() => setActiveView('dashboard')} />}
          </main>

          <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
            <strong>CanStyling</strong> &copy; 2026 - SENA ADSO Ficha 3186645 | Evidencia: GA7-220501096-AA4-EV03
          </footer>

          <AgendarCitaModal isOpen={isAgendarOpen} onClose={() => setIsAgendarOpen(false)} clientes={clientes} servicios={servicios} onCrearCita={handleCrearCita} />
          <LoginModal isOpen={isLoginOpen} onClose={() => setIsLoginOpen(false)} onLoginSuccess={u => setUser(u)} />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>

</html>
